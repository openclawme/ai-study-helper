<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>暂时离线 · 我的AI学习助手</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 55%, #f1f5f9 100%);
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  .card {
    width: min(420px, 100%);
    padding: 36px 30px 30px;
    border-radius: 24px;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 18px 60px rgba(30, 41, 59, .12);
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 30px;
    box-shadow: 0 8px 22px rgba(79, 70, 229, .28);
  }
  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .01em; }
  p { margin: 0 0 24px; font-size: 14px; line-height: 1.8; color: #64748b; }
  button, a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 22px;
    border: 0;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  button { background: #4f46e5; color: #fff; }
  button:active { transform: translateY(1px); }
  .link { margin-top: 14px; }
  .link a { color: #4f46e5; background: #eef2ff; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: rgba(30, 41, 59, .92); box-shadow: 0 18px 60px rgba(0, 0, 0, .35); }
    p { color: #94a3b8; }
    .link a { background: #1e293b; color: #a5b4fc; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">📘</div>
    <h1>暂时离线</h1>
    <p>网络恢复后刷新一下就好。你的错题、照片和对话都还在服务器上，不会丢。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
    <div class="link"><a href="/">返回首页</a></div>
  </main>
</body>
</html>
